[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-rag"
version = "0.1.0"
description = "Evidence-aware biomedical retrieval evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "bm25s>=0.2.14,<0.3",
  "catboost>=1.2,<2",
  "ir-datasets>=0.5.11,<0.6",
  "mlflow>=2.20,<4",
  "numpy>=1.26,<3",
  "pydantic-settings>=2.6,<3",
  "requests>=2.31,<3",
  "torch>=2.2,<3",
  "transformers>=4.46,<5",
  "typer>=0.12,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
evidence-rag = "evidence_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
